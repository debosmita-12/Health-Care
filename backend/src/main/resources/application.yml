server:
  port: 8080

spring:
  application:
    name: health-and-care-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:sample-data.sql
      continue-on-error: true

jwt:
  secret: ${JWT_SECRET:health-and-care-2026-super-secure-jwt-signing-key-minimum-256-bits-long-token}
  expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.healthandcare: DEBUG

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:healthandcare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthandcare}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
